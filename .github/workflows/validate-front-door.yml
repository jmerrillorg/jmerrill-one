name: Validate JM1 One Front Door

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm ci --omit=dev --prefix runtime/jm1-marketing-autonomous-functions
      - run: node scripts/test-jm1-front-door-intake.mjs
      - run: node scripts/test-jm1-productions-bp09-notice.mjs
      - run: node scripts/test-jm1-productions-bp09-review-checkpoint.mjs
      - run: node scripts/test-jm1-productions-bp09-review-checkpoint-dataverse.mjs
      - run: node scripts/test-prd-checkpoint-access-contract.mjs
      - run: node scripts/test-jm1-productions-bp09-retention.mjs
      - run: node scripts/test-jm1-productions-bp09-disposition.mjs
      - run: node --test tests/jsj-inquiry-review-form.test.mjs tests/jsj-inquiry-disposition.test.mjs
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.107'
      - run: dotnet build runtime/jm1-productions-bp09-reviewer-plugin/jm1-productions-bp09-reviewer-plugin.csproj --configuration Release --property:ContinuousIntegrationBuild=true --property:Deterministic=true
      - run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 2.8.1
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: pac solution pack --folder powerplatform/solutions/JM1ProductionsBP09InquiryReview --zipfile "$RUNNER_TEMP/JM1ProductionsBP09InquiryReview.zip" --packagetype Unmanaged
      - run: dotnet run --project scripts/verify-prd-plugin-artifact/verify-prd-plugin-artifact.csproj --configuration Release -- "$RUNNER_TEMP/JM1ProductionsBP09InquiryReview.zip" runtime/jm1-productions-bp09-reviewer-plugin/bin/Release/net48/jm1-productions-bp09-reviewer-plugin.dll powerplatform/solutions/JM1ProductionsBP09InquiryReview/PluginAssemblies/jm1-productions-bp09-reviewer-plugin-492C3322-EFBF-F111-AAAF-002248046419/jm1-productions-bp09-reviewer-plugin.dll
      - run: dotnet build runtime/jm1-jsj-inquiry-reviewer-plugin/jm1-jsj-inquiry-reviewer-plugin.csproj --configuration Release
      - run: node scripts/test-social-coverage-readback.mjs
      - run: npm --prefix runtime/jm1-marketing-autonomous-functions run check
      - run: npm --prefix runtime/jm1-marketing-autonomous-functions run test:native-reservation
      - run: npm run build
