<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSJ inquiry review</title>
  <style>
    :root { font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #20252b; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1080px; margin: auto; padding: 24px 20px 60px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 20px; border-bottom: 1px solid #d8dde2; padding-bottom: 14px; }
    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 1.06rem; margin: 0 0 10px; }
    p { margin: 0 0 12px; }
    .muted { color: #52606b; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    button, .open-record { min-height: 40px; border: 1px solid #7c8995; border-radius: 4px; padding: 8px 12px; background: #fff; color: #17354c; font: inherit; cursor: pointer; }
    button[aria-selected="true"], .open-record { background: #0f625a; border-color: #0f625a; color: white; }
    button:focus-visible, .open-record:focus-visible { outline: 3px solid #e69b36; outline-offset: 2px; }
    #status { min-height: 24px; margin-bottom: 18px; }
    #status.error { color: #a12622; font-weight: 600; }
    .group { border-top: 2px solid #d8dde2; padding-top: 16px; margin-top: 22px; }
    .group-note { color: #6b4800; background: #fff4d9; border-left: 3px solid #b67900; padding: 8px 10px; }
    article { border: 1px solid #c8d0d7; border-radius: 6px; padding: 16px; margin: 12px 0; overflow-wrap: anywhere; }
    .record-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 18px; }
    .record-heading h2 { margin: 0; }
    dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 12px 0; }
    dt { color: #52606b; }
    dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: #f2f5f6; border-left: 3px solid #738895; margin: 5px 0 14px; }
    .recommendation { border-top: 1px solid #e2e6e9; padding-top: 12px; }
    .open-record { display: inline-block; text-decoration: none; margin-top: 4px; }
    .decision-guide { margin-top: 14px; border-top: 1px solid #e2e6e9; padding-top: 12px; }
    .decision-guide strong { display: block; margin-top: 5px; }
    @media (max-width: 600px) { main { padding: 16px 12px 40px; } dl { grid-template-columns: 1fr; gap: 0; } dt { margin-top: 8px; } article { padding: 12px; } }
  </style>
</head>
<body>
<main>
  <header><h1>Jackie Smith Jr. inquiries</h1><p class="muted" id="refreshed">Not refreshed</p></header>
  <div class="toolbar" role="tablist" aria-label="Inquiry status">
    <button type="button" role="tab" data-view="open" aria-selected="true">Open</button>
    <button type="button" role="tab" data-view="overdue" aria-selected="false">Overdue</button>
    <button type="button" role="tab" data-view="completed" aria-selected="false">Completed</button>
    <button type="button" id="refresh">Refresh</button>
  </div>
  <p id="status" role="status" aria-live="polite">Loading current inquiries...</p>
  <div id="list"></div>
</main>
<script>
(function () {
  "use strict";
  var reviewerId = "5adf7e12-f093-f011-b4cb-6045bdeb7c0e";
  var status = document.getElementById("status");
  var list = document.getElementById("list");
  var refreshed = document.getElementById("refreshed");
  var tabs = Array.from(document.querySelectorAll('[role="tab"]'));
  var xrm;
  try { xrm = window.Xrm || parent.Xrm; } catch (_) { xrm = null; }
  var userId = xrm && xrm.Utility && xrm.Utility.getGlobalContext().userSettings.userId.replace(/[{}]/g, "").toLowerCase();
  if (!xrm || !xrm.WebApi || userId !== reviewerId) {
    status.textContent = "This private review queue is available only to Jackie's authorized JM1-Core sign-in.";
    status.className = "error";
    document.getElementById("refresh").disabled = true;
    return;
  }

  var rows = [];
  var view = "open";
  var lastRefresh = null;
  var currentAvailable = false;
  var fields = "jm1_jsjinquiryid,jm1_name,jm1_contactname,jm1_email,jm1_inquirytype,jm1_message,jm1_receivedat,jm1_deliverystate,jm1_closedat,jm1_transferredat,jm1_authoritativerecord,jm1_reviewdueat,jm1_reviewnextaction,jm1_disposition,_ownerid_value";
  var eastern = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", dateStyle: "medium", timeStyle: "short" });

  function node(tag, text, className) {
    var element = document.createElement(tag);
    if (text !== undefined) element.textContent = String(text);
    if (className) element.className = className;
    return element;
  }
  function date(value) { return value ? eastern.format(new Date(value)) + " ET" : "Not recorded"; }
  function completed(row) { return !!(row.jm1_closedat || row.jm1_transferredat || row.jm1_authoritativerecord); }
  function overdue(row) {
    if (completed(row)) return false;
    var due = row.jm1_reviewdueat ? Date.parse(row.jm1_reviewdueat) : Date.parse(row.jm1_receivedat) + 24 * 60 * 60 * 1000;
    return !Number.isFinite(due) || due < Date.now();
  }
  function age(row) {
    var hours = Math.max(0, Math.floor((Date.now() - Date.parse(row.jm1_receivedat)) / 3600000));
    return hours >= 24 ? Math.floor(hours / 24) + "d " + hours % 24 + "h" : hours + "h";
  }
  function duplicateKey(row) { return [row.jm1_email || "", row.jm1_message || ""].map(function (s) { return s.trim().toLowerCase(); }).join("\u0000"); }
  function opaqueText(row) {
    return /^[A-Za-z0-9]{12,80}$/.test((row.jm1_contactname || "").trim()) &&
      /^[A-Za-z0-9]{12,80}$/.test((row.jm1_message || "").trim());
  }
  function field(dl, label, value) { dl.append(node("dt", label), node("dd", value || "Not provided")); }

  function renderRecord(row, count) {
    var card = node("article");
    var heading = node("div", undefined, "record-heading");
    heading.append(node("h2", row.jm1_contactname || "Name not provided"), node("span", overdue(row) ? "Overdue" : completed(row) ? "Completed" : "Open", "muted"));
    card.append(heading);
    var details = node("dl");
    field(details, "Contact", row.jm1_email);
    field(details, "Received", date(row.jm1_receivedat));
    field(details, "Age", age(row));
    field(details, "Inquiry type", row.jm1_inquirytype);
    field(details, "Reference", row.jm1_name);
    field(details, "Delivery", row.jm1_deliverystate);
    if (row.jm1_reviewnextaction) field(details, "Next action", row.jm1_reviewnextaction);
    if (row.jm1_disposition) field(details, "Decision", row.jm1_disposition);
    if (row.jm1_reviewdueat) field(details, "Review due", date(row.jm1_reviewdueat));
    card.append(details, node("strong", "Original message"), node("div", row.jm1_message || "No message recorded", "message"));
    var recommendation = count > 1
      ? "Compare these " + count + " records: the sender address and original message match exactly. Each receipt remains separate. Decide whether either needs a response."
      : opaqueText(row)
      ? "The submitted name and message are short uninterrupted letter/number strings. That may warrant closer review, but does not establish spam; decide from the original record."
      : "Read the original message before deciding. No independent sender validation or customer outcome is recorded here; unusual text alone does not prove spam.";
    card.append(node("p", recommendation, "recommendation"));
    var link = node("a", "Open authenticated decision form", "open-record");
    link.href = xrm.Utility.getGlobalContext().getClientUrl() + "/main.aspx?pagetype=entityrecord&etn=jm1_jsjinquiry&id=" + encodeURIComponent(row.jm1_jsjinquiryid);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    card.append(link);
    var guide = node("div", undefined, "decision-guide");
    guide.append(node("strong", "Dismiss"), node("span", "Choose Dismiss in the decision form and give a reason. No reply is sent."));
    guide.append(node("strong", "Follow up"), node("span", "Choose Follow up, enter your intended next action and due time. This records an intention; it does not send a message."));
    guide.append(node("strong", "Keep open"), node("span", "Choose Keep open or Defer with a next action and due time. Opening this page alone does not reset the inquiry's age."));
    card.append(guide);
    return card;
  }

  function render() {
    tabs.forEach(function (tab) { tab.setAttribute("aria-selected", String(tab.dataset.view === view)); });
    list.replaceChildren();
    var chosen = rows.filter(function (row) { return view === "completed" ? completed(row) : view === "overdue" ? overdue(row) : !completed(row); });
    chosen.sort(function (a, b) { return Date.parse(a.jm1_receivedat) - Date.parse(b.jm1_receivedat); });
    var groups = new Map();
    chosen.forEach(function (row) { var key = duplicateKey(row); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(row); });
    groups.forEach(function (items) {
      var section = node("section", undefined, "group");
      if (items.length > 1) section.append(node("p", items.length + " matching submissions. Compare each original record before deciding.", "group-note"));
      items.forEach(function (row) { section.append(renderRecord(row, items.length)); });
      list.append(section);
    });
    status.className = "";
    status.textContent = chosen.length + " " + view + " inquiries";
  }

  async function refresh() {
    status.className = "";
    status.textContent = "Refreshing current inquiries...";
    try {
      var next = "?$select=" + fields + "&$orderby=jm1_receivedat desc&$top=100";
      var current = [];
      do {
        var result = await xrm.WebApi.retrieveMultipleRecords("jm1_jsjinquiry", next);
        current.push.apply(current, result.entities);
        if (current.length > 1000) throw new Error("Queue exceeds bounded review capacity");
        next = result.nextLink || null;
      } while (next);
      rows = current.filter(function (row) { return String(row._ownerid_value || "").replace(/[{}]/g, "").toLowerCase() === reviewerId; });
      // Owner must be included in the source query so a response cannot silently turn into an empty queue.
      if (current.length && !current.some(function (row) { return Object.prototype.hasOwnProperty.call(row, "_ownerid_value"); })) throw new Error("Owner field unavailable");
      lastRefresh = new Date();
      currentAvailable = true;
      refreshed.textContent = "Refreshed " + eastern.format(lastRefresh) + " ET";
      render();
    } catch (_) {
      rows = [];
      currentAvailable = false;
      list.replaceChildren();
      status.className = "error";
      status.textContent = "Current inquiries are unavailable. Do not rely on an older list; refresh or use JM1-Core directly.";
      refreshed.textContent = lastRefresh ? "Last successful refresh " + eastern.format(lastRefresh) + " ET; list unavailable" : "No successful refresh";
    }
  }
  tabs.forEach(function (tab) { tab.addEventListener("click", function () { view = tab.dataset.view; if (currentAvailable) render(); }); });
  document.getElementById("refresh").addEventListener("click", refresh);
  refresh();
}());
</script>
</body>
</html>
